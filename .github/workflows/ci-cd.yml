name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LOWER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LOWER }}/grade-api:latest
            ghcr.io/${{ env.OWNER_LOWER }}/grade-api:${{ github.sha }}
      
      - name: Update GitOps repository
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          # Configure git credential store
          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
          
          # Remove any existing gitops directory
          rm -rf gitops
          
          # Clone repository
          git clone https://github.com/palachev/grade-api-gitops.git gitops
          cd gitops
          
          # ОТЛАДКА: Показать строку с image
          echo "=== Поиск строки с image ==="
          grep "image:" deployment.yaml || echo "Строка с image не найдена!"
          
          # ОТЛАДКА: Показать что ищем
          echo "Ищем: image: ghcr.io/${{ env.OWNER_LOWER }}/grade-api:.*"
          
          # Используем более гибкий поиск - ищем ЛЮБУЮ строку с image, содержащую grade-api
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image:.*grade-api:.*|image: ghcr.io/${{ env.OWNER_LOWER }}/grade-api:${{ github.sha }}|g" deployment.yaml
          else
            sed -i "s|image:.*grade-api:.*|image: ghcr.io/${{ env.OWNER_LOWER }}/grade-api:${{ github.sha }}|g" deployment.yaml
          fi
          
          # ОТЛАДКА: Показать изменения
          echo "=== После замены ==="
          grep "image:" deployment.yaml
          
          # Проверяем, есть ли изменения
          if git diff --quiet; then
            echo "❌ НЕТ ИЗМЕНЕНИЙ!"
            echo "Текущий хеш в файле:"
            grep "image:" deployment.yaml
            echo "Новый хеш: ${{ github.sha }}"
            
            # Принудительно обновляем файл
            echo "Принудительно обновляем файл..."
            if [[ "$OSTYPE" == "darwin"* ]]; then
              sed -i '' "s|image: ghcr.io/palachev/grade-api:latest|image: ghcr.io/palachev/grade-api:${{ github.sha }}|g" deployment.yaml
            else
              sed -i "s|image: ghcr.io/palachev/grade-api:latest|image: ghcr.io/palachev/grade-api:${{ github.sha }}|g" deployment.yaml
            fi
            
            # Проверяем снова
            if git diff --quiet; then
              echo "Все равно нет изменений. Возможно, файл уже содержит нужный хеш."
              exit 0
            fi
          fi
          
          # Commit changes
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          
          # Push
          git push https://${GIT_TOKEN}@github.com/palachev/grade-api-gitops.git main
